<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code usage</title>
<style>
:root {
  color-scheme: dark;
  --page: #0b0b0a; --surface: #151514; --raised: #232321; --ink: #f7f6f2; --ink2: #bdbcb2; --muted: #85837c;
  --grid: #222220; --axis: #35352f; --line: rgba(255,255,255,.09); --wash: rgba(255,255,255,.05);
  --plan: #ecebe4; --glow: rgba(236,235,228,.3); --shade: rgba(0,0,0,.5);
  --m1: #3987e5; --m2: #d95926; --m3: #199e70; --m4: #c98500; --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --page: #f1f1ee; --surface: #fcfcfb; --raised: #ecebe6; --ink: #0b0b0b; --ink2: #52514e; --muted: #6e6c67;
    --grid: #eae9e3; --axis: #cdccc4; --line: rgba(11,11,11,.1); --wash: rgba(11,11,11,.045);
    --plan: #2b2a27; --glow: rgba(0,0,0,0); --shade: rgba(0,0,0,.18);
    --m1: #2a78d6; --m2: #eb6834; --m3: #1baf7a; --m4: #eda100;
  }
}
html, body, body * { scrollbar-width: none; }
::-webkit-scrollbar { display: none; }
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; min-width: 1200px; display: grid; grid-template-rows: 56px minmax(0, 1fr); background: var(--page); color: var(--ink); font: 13px/1.4 Geist, "Segoe UI", system-ui, sans-serif; }
button, input, textarea { font: inherit; }
[hidden] { display: none !important; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes reveal { from { clip-path: inset(-14px 100% -14px -14px); } to { clip-path: inset(-14px -14px -14px -14px); } }
@keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes growx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } to { transform: scale(1); } }
@keyframes ping { from { transform: scale(1); opacity: .5; } to { transform: scale(3.4); opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes menu { from { opacity: 0; transform: translateY(-6px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes dialog { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
header { display: flex; align-items: center; gap: 24px; padding: 0 20px; position: relative; z-index: 30; }
header nav { display: flex; gap: 2px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); padding: 4px 16px 16px; min-height: 0; transition: opacity .25s; }
.busy main { opacity: .35; pointer-events: none; }
.grid12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; min-height: 0; overflow: auto; border-radius: 16px; }
.panes { display: grid; gap: 12px; min-height: 0; }
.panel { background: var(--surface); border-radius: 16px; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
.pad { padding: 18px 22px 14px; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 24px 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.col { display: flex; flex-direction: column; min-width: 0; }
.fill { flex: 1; min-height: 0; }
.scroll { overflow: auto; }
.scroll > * { flex: none; }
.el { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h { margin: 0; font-size: 13px; font-weight: 500; color: var(--ink2); }
.sub { color: var(--muted); font-size: 12px; }
.note { padding: 24px; margin: 0; }
.tn { font-variant-numeric: tabular-nums; }
.mono { font-family: "Geist Mono", ui-monospace, Consolas, monospace; font-size: 11.5px; }
.r { text-align: right; }
.big { font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; }
.huge { font-size: 44px; font-weight: 500; line-height: .95; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.huge small { font-size: 20px; color: var(--muted); letter-spacing: 0; margin-left: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.legend { display: flex; gap: 16px; }
.track { display: block; height: 6px; border-radius: 3px; background: var(--wash); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 3px; }
.live { position: relative; }
.live::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: ping 2s cubic-bezier(0,0,.2,1) infinite; }
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--wash); border-radius: 9px; justify-self: start; }
.seg button { font-size: 12px; font-weight: 500; color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 0 10px; height: 26px; cursor: pointer; white-space: nowrap; transition: color .2s, background .2s; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed=true] { background: var(--raised); color: var(--ink); }
.tab { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 500; cursor: pointer; transition: color .2s, background .2s; }
.tab:hover { color: var(--ink); }
.tab[aria-pressed=true] { color: var(--ink); background: var(--wash); }
.ctl { color: var(--ink2); background: var(--wash); border: 0; border-radius: 9px; height: 30px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; flex: none; transition: background .2s, color .2s; }
.ctl:hover, .ctl[aria-expanded=true] { background: var(--raised); color: var(--ink); }
.ctl.wide { width: 100%; height: 34px; margin-top: auto; }
.chev { transition: transform .2s; flex: none; }
.chev.open { transform: rotate(180deg); }
.busy .spin { animation: spin .8s linear infinite; }
.veil { position: fixed; inset: 0; border: 0; padding: 0; background: transparent; cursor: default; }
.menu { position: absolute; right: 0; top: 36px; width: 236px; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 5px; box-shadow: 0 18px 44px var(--shade); transform-origin: top right; animation: menu .16s cubic-bezier(.2,.8,.2,1) both; }
.opt { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; color: var(--ink2); text-align: left; background: transparent; border: 0; border-radius: 8px; cursor: pointer; transition: background .15s, color .15s; }
.opt:hover { background: var(--wash); color: var(--ink); }
.opt[aria-selected=true] { color: var(--ink); }
.opt[aria-selected=false] svg { opacity: 0; }
.modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; }
.scrim { position: absolute; inset: 0; border: 0; padding: 0; background: var(--shade); cursor: default; animation: fade .2s both; }
.dialog { position: relative; max-width: calc(100% - 48px); padding: 6px 0 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 30px 80px var(--shade); animation: dialog .28s cubic-bezier(.2,.8,.2,1) both; }
.off { opacity: .35; pointer-events: none; }
.strip { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--grid); }
.kpi { color: inherit; text-align: left; background: var(--surface); border: 0; padding: 0 20px; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; transition: background .2s; }
.kpi .row { white-space: nowrap; gap: 8px; }
button.kpi { cursor: pointer; }
button.kpi:hover { background: var(--raised); }
.wrow { display: grid; align-items: center; gap: 12px; height: 31px; color: inherit; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 0 8px; margin: 0 -8px; width: calc(100% + 16px); transition: background .2s, opacity .3s; }
.wrow:hover { background: var(--wash); }
.slot { display: block; height: 10px; position: relative; }
.slot i { display: block; height: 100%; min-width: 2px; border-radius: 0 5px 5px 0; background: var(--plan); }
.slot.thin { height: 8px; }
.slot.twin i { position: absolute; inset: 0 auto 0 0; transition: width .3s; }
.stack { display: flex; gap: 2px; height: 10px; }
.stack i { border-radius: 0; min-width: 0; }
.stack i:last-child { border-radius: 0 5px 5px 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; width: 100%; padding: 9px 12px; flex: none; color: inherit; text-align: left; background: transparent; border: 0; border-radius: 11px; cursor: pointer; transition: background .2s; }
.item:hover { background: var(--wash); }
.item[aria-pressed=true] { background: var(--raised); }
.item b, .tr b { font-weight: 500; }
.items { overflow: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px; }
.pills { display: flex; gap: 6px; padding: 0 24px 14px; overflow: hidden; }
.pill { font-size: 12px; color: var(--ink2); background: transparent; border: 1px solid var(--line); border-radius: 999px; height: 28px; padding: 0 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .2s, color .2s, border-color .2s; }
.pill:hover { color: var(--ink); border-color: var(--axis); }
.pill[aria-pressed=true] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.thread { overflow: auto; display: flex; flex-direction: column-reverse; border-top: 1px solid var(--grid); }
.turns { width: 100%; max-width: 680px; margin: 0 auto; padding: 18px 24px 26px; display: flex; flex-direction: column; gap: 26px; }
.turn { display: flex; flex-direction: column; gap: 10px; }
.turn p { margin: 0; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.said { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.bubble { font-size: 14px; line-height: 1.5; color: var(--ink); text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--raised); border: 0; border-radius: 18px 18px 5px 18px; padding: 10px 15px; max-width: 78%; cursor: pointer; transition: box-shadow .25s; }
.bubble:hover { box-shadow: 0 0 0 1px var(--axis); }
.bubble[aria-pressed=true] { box-shadow: 0 0 0 1.5px var(--ink2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 26px; max-width: 100%; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; font-family: "Geist Mono", ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; }
.chip b { font-weight: 500; color: var(--ink); }
.card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.rule { display: flex; align-items: center; gap: 12px; }
.rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: var(--grid); }
.more { font-size: 12px; color: var(--muted); background: transparent; border: 0; align-self: center; height: 28px; padding: 0 12px; border-radius: 999px; cursor: pointer; transition: color .2s, background .2s; }
.more:hover { color: var(--ink); background: var(--wash); }
.step { color: var(--ink2); background: var(--wash); border: 0; border-radius: 8px; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; flex: none; cursor: pointer; transition: background .2s, color .2s; }
.step:hover { background: var(--raised); color: var(--ink); }
.go { font-weight: 500; color: var(--page); background: var(--ink); border: 0; border-radius: 9px; height: 34px; padding: 0 14px; cursor: pointer; transition: opacity .2s; }
.go:hover { opacity: .86; }
.tog { flex: none; position: relative; width: 36px; height: 20px; padding: 0; border: 0; border-radius: 10px; background: var(--axis); cursor: pointer; transition: background .2s; }
.tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
.tog[aria-checked=true] { background: var(--good); }
.tog[aria-checked=true]::after { transform: translateX(16px); background: #fff; }
.set { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; border-top: 1px solid var(--grid); }
.txt { font-size: 12px; margin: 0; width: 100%; height: 340px; overflow: auto; white-space: pre-wrap; padding: 12px 14px; border: 0; border-radius: 10px; background: var(--wash); color: var(--ink2); line-height: 1.55; resize: none; outline: 0; }
textarea.txt { color: var(--ink); box-shadow: inset 0 0 0 1px var(--axis); }
textarea.txt:focus { box-shadow: inset 0 0 0 1.5px var(--ink2); }
.search { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; background: var(--wash); border-radius: 10px; color: var(--muted); }
.search input { flex: 1; min-width: 0; color: var(--ink); background: transparent; border: 0; outline: 0; }
.tr { display: grid; align-items: center; gap: 12px; padding: 0 24px; min-height: 38px; font-variant-numeric: tabular-nums; transition: background .2s, opacity .3s; }
.tr > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr.th { color: var(--muted); font-size: 12px; min-height: 28px; }
.tr.top { border-top: 1px solid var(--grid); min-height: 40px; }
button.tr { color: inherit; text-align: left; width: 100%; background: transparent; border: 0; cursor: pointer; }
button.tr:hover, button.tr[aria-pressed=true] { background: var(--wash); }
.link { display: flex; align-items: center; gap: 8px; color: inherit; text-align: left; background: transparent; border: 0; padding: 4px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; transition: background .2s; }
.link:hover { background: var(--wash); }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px; margin: 0; padding: 7px 8px; flex: none; }
.pair .sub:last-child { grid-column: 1 / -1; }
.line { border-top: 1px solid var(--grid); padding-top: 16px; }
.foot { padding: 10px 24px 14px; border-top: 1px solid var(--grid); }
svg text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
svg text.v { fill: var(--ink); font-weight: 500; font-size: 12px; }
.g { stroke: var(--grid); }
.ax { stroke: var(--axis); }
.glow { filter: drop-shadow(0 0 6px var(--glow)); }
.band { transition: x .3s cubic-bezier(.2,.8,.2,1); }
#tip { position: fixed; z-index: 50; pointer-events: none; display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 5px 8px; min-width: 164px; padding: 10px 12px; background: var(--raised); border-radius: 10px; box-shadow: 0 18px 44px var(--shade); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
#tip b { grid-column: 1 / -1; color: var(--ink); font-weight: 500; font-size: 12px; }
#tip strong { color: var(--ink); font-weight: 500; text-align: right; }
#tip i { width: 8px; height: 8px; border-radius: 2px; }
.ping { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ping 2.4s cubic-bezier(0,0,.2,1) 2.1s infinite; }
.reveal { animation: reveal 1.5s cubic-bezier(.45,0,.2,1) .2s both; }
.late { animation: fade .6s ease 1.6s both; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3,1.4,.5,1) 1.5s both; }
.gy { animation: growy 1s cubic-bezier(.2,.8,.2,1) .15s both; }
.gbar { transform-origin: left; animation: growx .9s cubic-bezier(.2,.8,.2,1) both; }
.gup { animation: rise .5s cubic-bezier(.2,.7,.2,1) both; }
.sp { animation: reveal 1.1s cubic-bezier(.45,0,.2,1) .15s both; }
.gf { animation: fade .7s ease both; }
.still .panel, .still .gup, .still .gbar, .still .gy, .still .sp { animation: none; }
@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
</style>

<body class="busy">
<header id="head"></header>
<main id="main"></main>
<div id="layer"></div>
<div id="tip" hidden></div>
<script>
const NS = 'http://www.w3.org/2000/svg', DAY = 864e5;
// Tokens a deferred tool keeps in every request
const DEFERRED = 15;
const KEYS = ['requests', 'input', 'output', 'cacheWrite', 'cacheRead', 'cost', 'cIn', 'cOut', 'cRead', 'cWrite', 'saved', 'p5', 'p7', 'wk'];
// Model families: id fragment, name, colour
const FAMILIES = [['fable', 'Fable', 'var(--m1)'], ['opus', 'Opus', 'var(--m2)'], ['sonnet', 'Sonnet', 'var(--m3)'], ['haiku', 'Haiku', 'var(--m4)'], ['', 'Other', 'var(--muted)']];
const TABS = [['overview', 'Overview'], ['sessions', 'Sessions'], ['tools', 'Tools'], ['breakdown', 'Breakdown'], ['context', 'Context']];
const TYPES = [['Input', 'input', 'cIn'], ['Output', 'output', 'cOut'], ['Cache read', 'cacheRead', 'cRead'], ['Cache write', 'cacheWrite', 'cWrite']];
const KINDS = { tools: 'Tools', skills: 'Skills', blocks: 'Injected blocks', sections: 'System prompt', files: 'File reads' };
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
// Icon outlines, 24 by 24, paths split by |
const ICON = {
  down: 'M6 9l6 6 6-6', up: 'M6 15l6-6 6 6', prev: 'M15 5l-7 7 7 7', next: 'M9 5l7 7-7 7', check: 'M5 12.5l4.5 4.5L19 7.5', close: 'M6 6l12 12|M18 6L6 18',
  minus: 'M5 12h14', plus: 'M5 12h14|M12 5v14', reset: 'M4 9h10a5 5 0 0 1 0 10H9|M8 5L4 9l4 4', refresh: 'M20 12a8 8 0 1 1-2.3-5.7|M20 4v5h-5', search: 'M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0|M20 20l-3.5-3.5',
};
const state = { range: 30, project: '', menu: false, q: '', sort: 'recent', by: 'project', metric: 'tokens', tsort: 'calls', tool: '', extra: 'fails', side: 'tools', kind: 'tools', cf: 'all', openG: { 'Built-in': true } };
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
// The usage data, the open session and the context catalog with its draft rules
let data, cur, cx;

// HTML element builder; string children become text nodes
const h = (tag, a = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(a)) if (v != null && v !== false) k.startsWith('on') ? e.addEventListener(k.slice(2), v) : k in e ? e[k] = v : e.setAttribute(k, v);
  e.append(...kids.flat(Infinity).filter(k => k != null && k !== false));
  return e;
};
// SVG element builder
const svg = (tag, a = {}) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
  return e;
};
const $ = id => document.getElementById(id);
const icon = (d, size = 12, cls = '') => {
  const g = svg('svg', { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 2.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true', class: cls });
  g.innerHTML = d.split('|').map(p => `<path d="${p}"/>`).join('');
  return g;
};
// SVG chart from markup; its text is numbers and dates only
const chart = (box, label, markup, attrs = {}) => {
  const g = svg('svg', { viewBox: `0 0 ${box}`, width: '100%', height: '100%', ...(label ? { role: 'img', 'aria-label': label } : { 'aria-hidden': 'true' }), ...attrs });
  g.innerHTML = markup;
  return g;
};

// Formatters
const guard = f => (n, ...r) => Number.isFinite(n) ? f(n, ...r) : '–';
const fmt = {
  int: guard(n => Math.round(n).toLocaleString('en-US')),
  num: guard(n => n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(Math.round(n))),
  kt: guard(n => n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(Math.round(n))),
  usd: guard(n => (n < 0 ? '−$' : '$') + Math.abs(n).toFixed(2)),
  usd0: guard(n => '$' + Math.round(n).toLocaleString('en-US')),
  pct: guard(n => n.toFixed(1) + '%'),
  dur: guard(ms => ms < 1e3 ? Math.round(ms) + 'ms' : ms < 6e4 ? (ms / 1e3).toFixed(1) + 's' : ms < 36e5 ? `${Math.floor(ms / 6e4)}m ${Math.floor(ms % 6e4 / 1e3)}s` : ms < DAY ? `${Math.floor(ms / 36e5)}h ${Math.floor(ms % 36e5 / 6e4)}m` : `${Math.floor(ms / DAY)}d ${Math.floor(ms % DAY / 36e5)}h`),
  clock: guard(ms => new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })),
  date: guard(ms => new Date(ms).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })),
  day: d => new Date(d + 'T00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
  long: d => new Date(d + 'T00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
};

// Aggregation helpers
const sum = (rows, f = v => v) => rows.reduce((t, r) => t + (f(r) || 0), 0);
const div = (a, b) => b ? a / b : 0;
