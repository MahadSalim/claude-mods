<!doctype html>
<html lang="en" data-frameless>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings Manager</title>
<link rel="icon" href="/icon.png">
<style>
:root { color-scheme: dark; --bg: #1e1e1e; --bar: #181818; --line: #2f2f2f; --hover: #2a2a2a; --active: #353535; --text: #ececec; --dim: #9c9c9c; --field: #262626; --blue: #2f7ae5; --control: 220px }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif }
body { display: flex; flex-direction: column; overflow: hidden }
button { font: inherit; color: inherit; cursor: pointer }
.titlebar { display: none; height: 36px; flex: none; align-items: center; background: var(--bar); border-bottom: 1px solid var(--line); user-select: none }
[data-frameless="true"] .titlebar { display: flex }
.titlebar img { width: 16px; height: 16px; margin: 0 10px 0 12px }
.titlebar span { flex: 1; font-size: 12.5px; color: #c8c8c8 }
.titlebar button { width: 46px; height: 100%; border: 0; background: none; display: grid; place-items: center; color: #c8c8c8 }
.titlebar button:hover { background: #2d2d2d }
.titlebar button.close:hover { background: #c42b1c; color: #fff }
.titlebar svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1 }
.edge { position: fixed; z-index: 30; display: none }
[data-frameless="true"] .edge { display: block }
.app { flex: 1; display: flex; min-height: 0 }
aside { width: 250px; flex: none; padding: 14px 12px; border-right: 1px solid var(--line); overflow-y: auto }
.search { display: flex; align-items: center; gap: 8px; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-bottom: 12px }
.search input { flex: 1; min-width: 0; background: none; border: 0; color: var(--text); font: inherit; outline: none }
nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; font-size: 15px; text-align: left }
nav button:hover { background: var(--hover) }
nav button.on { background: var(--active) }
nav hr { border: 0; border-top: 1px solid var(--line); margin: 10px 14px }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none }
main { flex: 1; overflow-y: auto; padding: 22px 32px 60px }
.wrap { max-width: 880px; margin: 0 auto }
.head { display: flex; align-items: center; gap: 12px }
.head .text { flex: 1 }
h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px }
h2 { font-size: 15px; font-weight: 600; margin: 32px 0 2px }
.note { color: var(--dim); font-size: 13px }
.row { display: flex; align-items: center; gap: 24px; padding: 13px 12px; margin: 0 -12px; border-bottom: 1px solid var(--line) }
.row.open { cursor: pointer; border-radius: 8px }
.row.open:hover, .row.open:focus-visible { background: var(--hover); outline: none }
.group > .row:last-child { border-bottom: 0 }
.text { flex: 1; min-width: 0 }
.title { font-size: 15px; display: flex; gap: 8px; align-items: center; overflow-wrap: anywhere }
.desc { color: var(--dim); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px }
.badge { font-size: 11px; color: var(--dim); border: 1px solid #474747; border-radius: 999px; padding: 0 7px; white-space: nowrap }
.ctl { display: flex; gap: 8px; align-items: center; flex: none }
.switch { width: 44px; height: 24px; border-radius: 12px; border: 0; background: #3c3c3c; position: relative; transition: background .15s }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s }
.switch[aria-checked="true"] { background: var(--blue) }
.switch[aria-checked="true"]::after { transform: translateX(20px) }
select, input.field, textarea { background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: inherit; padding: 7px 10px; outline: none }
select, input.field { width: var(--control) }
select:focus, input.field:focus, textarea:focus { border-color: #4a4a4a }
.seg { display: flex; background: var(--field); border: 1px solid var(--line); border-radius: 9px; padding: 2px }
.seg button { border: 1px solid transparent; background: none; padding: 5px 13px; border-radius: 7px }
.seg button.on { background: #383838; border-color: #565656 }
.btn { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px }
.btn:hover { background: var(--hover) }
.btn.primary { background: var(--blue); border-color: var(--blue) }
.btn.icon { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; color: #c8c8c8 }
.btn.icon svg.i { width: 17px; height: 17px }
.btn:disabled { opacity: .4; cursor: default; background: var(--field) }
.badge.edited { color: #e8a084; border-color: #8a4d38 }
.empty { color: var(--dim); padding: 16px 0 }
.overlay { position: fixed; inset: 36px 0 0; background: #0009; display: grid; place-items: center; z-index: 20 }
[data-frameless="false"] .overlay { inset: 0 }
.dialog { width: min(1000px, 92vw); height: 84%; background: var(--bg); border: 1px solid #3a3a3a; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 20px 60px #000a }
.dialog header, .dialog footer { display: flex; align-items: center; gap: 8px; padding: 12px 16px }
.dialog header { border-bottom: 1px solid var(--line) }
.dialog footer { border-top: 1px solid var(--line); justify-content: flex-end }
.dialog header .title { flex: 1; font-weight: 600 }
.dialog footer .ask { flex: 1; color: var(--dim) }
.dialog pre, .dialog textarea { flex: 1; margin: 0; padding: 14px 16px; overflow: auto; font: 13px/1.55 Consolas, ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere }
.dialog textarea { border: 0; border-radius: 0; resize: none; background: #1a1a1a }
#toast { position: fixed; bottom: 18px; right: 18px; background: #5b2121; padding: 10px 14px; border-radius: 8px; display: none; max-width: 440px; white-space: pre-wrap; z-index: 40 }
::-webkit-scrollbar { width: 10px }
::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 5px }
</style>
</head>
<body>
<div class="titlebar" id="titlebar">
  <img src="/icon.svg" alt=""><span>Settings Manager</span>
  <button data-do="min" title="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
  <button data-do="max" id="max" title="Maximize"></button>
  <button data-do="close" class="close" title="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
</div>
<div class="app">
  <aside>
    <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><input id="query" placeholder="Search" autofocus></label>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script>
const token = new URLSearchParams(location.search).get('t')
const ICONS = {
  skills: 'M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z',
  prompts: 'M6 3h9l4 4v14H6z M14 3v5h5 M9 12h7 M9 16h7',
  agents: 'M5 8h14v11H5z M12 4v4 M9 12.5v1 M15 12.5v1 M9 16h6',
  commands: 'M4 5h16v14H4z M8 10l3 2-3 2 M13 15h4',
  tools: 'M14.5 6.5a4 4 0 0 0-5.3 5.3L4 17l3 3 5.2-5.2a4 4 0 0 0 5.3-5.3l-2.5 2.5-2.5-.5-.5-2.5z',
  plugins: 'M5 9V5h4a2 2 0 1 1 4 0h4v4a2 2 0 1 1 0 4v6h-5a2 2 0 1 0-4 0H5v-6a2 2 0 1 0 0-4z',
  hooks: 'M15 3v10a4.5 4.5 0 0 1-9 0v-2 M6 11l-2.5 2.5 M15 3h3',
  general: 'M4 7h9 M17 7h3 M15 5v4 M4 17h3 M11 17h9 M9 15v4',
  folder: 'M3 6.5A1.5 1.5 0 0 1 4.5 5h4l2 2h9A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z',
  close: 'M6 6l12 12 M18 6L6 18',
  reset: 'M4.5 12a7.5 7.5 0 1 0 2.2-5.3 M4.5 4v4.5H9',
}
const WINDOW_ICONS = { max: 'M.5.5h9v9h-9z', restore: 'M.5 2.5h7v7h-7z M2.5 2.5v-2h7v7h-2' }
const LINE_AFTER = new Set(['tools', 'hooks'])
const LONG_TEXT = 90
const $ = id => document.getElementById(id)
let sections = []
let current = 'skills'
let modal = null

/** Builds an element: `h('div', { class: 'row', onclick }, ...children)`. */
function h(tag, props = {}, ...children) {
  const node = document.createElement(tag)
  for (const [key, value] of Object.entries(props)) {
    if (value === undefined) continue
    if (key.startsWith('on')) node.addEventListener(key.slice(2), value)
    else if (key in node && key !== 'list') node[key] = value
    else node.setAttribute(key, value)
  }
  node.append(...children.flat(Infinity).filter(child => child !== undefined && child !== null && child !== false))
  return node
}

function icon(name) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('class', 'i')
  svg.setAttribute('viewBox', '0 0 24 24')
  svg.innerHTML = `<path d="${ICONS[name]}"/>`
  return svg
}

const iconButton = (name, title, onclick) => h('button', { class: 'btn icon', title, 'aria-label': title, onclick }, icon(name))

async function call(path, body) {
  const res = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'x-token': token, 'content-type': 'application/json' }, body: body && JSON.stringify(body) })
  if (!res.ok) throw new Error(await res.text())
  sections = (await res.json()).sections
  render()
}

function showError(error) {
  const toast = $('toast')
  toast.textContent = error.message ?? String(error)
  toast.style.display = 'block'
  clearTimeout(showError.timer)
  showError.timer = setTimeout(() => (toast.style.display = 'none'), 6000)
}

const act = (action, value) => call('/api/act', { act: action, value }).catch(showError)
const win = command => fetch(`/api/window?do=${encodeURIComponent(command)}`, { method: 'POST', headers: { 'x-token': token } }).catch(() => {})

function control(item) {
  const kind = item.control ?? 'switch'
  if (kind === 'switch')
    return h('button', { class: 'switch', role: 'switch', 'aria-checked': String(!!item.value), 'aria-label': item.title, onclick: () => act(item.act, !item.value) })
  if (kind === 'segmented')
    return h('div', { class: 'seg' }, item.options.map(o => h('button', { class: o.value === item.value ? 'on' : '', onclick: () => act(item.act, o.value) }, o.label)))
  if (kind === 'select') {
    const options = item.options.some(o => o.value === (item.value ?? '')) ? item.options : [...item.options, { value: item.value, label: item.value }]
    return h('select', { onchange: e => act(item.act, e.target.value) }, options.map(o => h('option', { value: o.value, selected: o.value === (item.value ?? '') }, o.label)))
  }
  return h('input', { class: 'field', value: item.value ?? '', onchange: e => act(item.act, e.target.value), onkeydown: e => e.key === 'Enter' && e.target.blur() })
}

const fullText = item => item.view ?? item.edit?.text ?? (item.description?.length > LONG_TEXT ? item.description : undefined)

/** Opens the text viewer, which has an Edit button for editable text. */
function openModal(item) {
  modal = { item, isEditing: false, draft: item.edit?.text, asking: undefined }
  renderModal()
}

const ask = question => ((modal.asking = question), renderModal())

function closeModal(force) {
  if (!force && modal.isEditing && modal.draft !== modal.item.edit.text) return ask('discard')
  modal = null
  renderModal()
}

function save() {
  act({ type: 'edit', path: modal.item.edit.path, text: modal.draft }, null)
  closeModal(true)
}

/** Questions the modal asks before it drops text: the prompt, the confirm label, and what confirming does. */
const QUESTIONS = {
  discard: ['Discard your unsaved changes?', 'Keep editing', 'Discard', () => closeModal(true)],
  reset: ["Reset to Claude's original text? Your edits will be lost.", 'Cancel', 'Reset', () => (act({ type: 'reset', ...modal.item.edit }, null), closeModal(true))],
}

const badges = item => [item.badge && h('span', { class: 'badge' }, item.badge), item.isEdited && h('span', { class: 'badge edited' }, 'edited')]

function renderModal() {
  if (!modal) return $('modal').replaceChildren()
  const { item, isEditing, asking } = modal
  const area = isEditing && h('textarea', { value: modal.draft, spellcheck: false, oninput: e => (modal.draft = e.target.value) })
  const [question, keep, confirm, onConfirm] = QUESTIONS[asking] ?? []
  const footer = asking
    ? [h('span', { class: 'ask' }, question), h('button', { class: 'btn', onclick: () => ask(undefined) }, keep), h('button', { class: 'btn primary', onclick: onConfirm }, confirm)]
    : isEditing
      ? [
          h('span', { class: 'ask' }),
          h('button', { class: 'btn icon', title: 'Reset to default', 'aria-label': 'Reset to default', disabled: !item.edit.isEdited, onclick: () => ask('reset') }, icon('reset')),
          h('button', { class: 'btn', onclick: () => closeModal() }, 'Cancel'),
          h('button', { class: 'btn primary', onclick: save }, 'Save'),
        ]
      : undefined
  $('modal').replaceChildren(h('div', { class: 'overlay', onmousedown: e => e.target === e.currentTarget && closeModal() },
    h('div', { class: 'dialog', role: 'dialog', 'aria-label': item.title },
      h('header', {},
        h('div', { class: 'title' }, item.title, badges(item)),
        item.edit && !isEditing && h('button', { class: 'btn', onclick: () => ((modal.isEditing = true), renderModal()) }, 'Edit'),
        iconButton('close', 'Close', () => closeModal()),
      ),
      isEditing ? area : h('pre', {}, fullText(item)),
      footer && h('footer', {}, footer),
    ),
  ))
  area?.focus()
}

function row(item) {
  const open = fullText(item) && (e => !e.target.closest('.ctl') && (e.type === 'click' || e.key === 'Enter') && openModal(item))
  return h('div', { class: open ? 'row open' : 'row', tabIndex: open ? 0 : undefined, onclick: open || undefined, onkeydown: open || undefined },
    h('div', { class: 'text' },
      h('div', { class: 'title' }, item.title, badges(item)),
      item.description && h('div', { class: 'desc' }, item.description),
    ),
    h('div', { class: 'ctl' }, control(item)),
  )
}

const groups = (list, heading) => list.map(group => h('div', { class: 'group' }, h(heading, {}, group.title), group.items.map(row)))

function render() {
  const query = $('query').value.trim().toLowerCase()
  $('nav').replaceChildren(...sections.flatMap(section => [
    h('button', { class: !query && section.id === current ? 'on' : '', onclick: () => (($('query').value = ''), (current = section.id), render(), ($('main').scrollTop = 0)) }, icon(section.id), section.title),
    LINE_AFTER.has(section.id) && h('hr'),
  ].filter(Boolean)))
  const scroll = $('main').scrollTop
  let body
  if (query) {
    const matches = item => [item.title, item.description, item.badge].some(text => String(text ?? '').toLowerCase().includes(query))
    const found = sections
      .map(section => ({ ...section, groups: section.groups.map(group => ({ ...group, items: group.items.filter(matches) })).filter(group => group.items.length) }))
      .filter(section => section.groups.length)
    body = found.length
      ? found.map(section => [h('h1', { style: 'margin-top:28px' }, section.title), groups(section.groups, 'h2')])
      : h('div', { class: 'empty' }, 'Nothing matches your search.')
  } else {
    const section = sections.find(section => section.id === current) ?? sections[0]
    body = [
      h('div', { class: 'head' },
        h('div', { class: 'text' }, h('h1', {}, section.title), h('div', { class: 'note' }, section.note)),
        section.folder !== '' && iconButton('folder', 'Open folder', () => act({ type: 'reveal', folder: section.folder }, null)),
      ),
      section.groups.length ? groups(section.groups, 'h2') : h('div', { class: 'empty' }, 'Nothing here yet. Start a Claude Code session with the mod loaded, then reopen this window.'),
    ]
  }
  $('main').replaceChildren(h('div', { class: 'wrap' }, body))
  $('main').scrollTop = scroll
}

/**
 * Redraws the maximize button, and reports the page size to the window helper once the size settles.
 * The helper clips the browser's own title bar from that size, so a size read before the browser
 * finished laying out the window would leave its empty title bar showing above ours.
 */
function frame() {
  const isMax = outerWidth >= screen.availWidth && outerHeight >= screen.availHeight
  $('max').title = isMax ? 'Restore' : 'Maximize'
  $('max').innerHTML = `<svg viewBox="0 0 10 10"><path d="${WINDOW_ICONS[isMax ? 'restore' : 'max']}"/></svg>`
  clearTimeout(frame.timer)
  frame.timer = setTimeout(() => {
    const size = `${innerWidth} ${innerHeight} ${devicePixelRatio}`
    if (frame.size !== size) win(`frame ${(frame.size = size)}`)
  }, 150)
}

if (document.documentElement.dataset.frameless === 'true') {
  const EDGES = { 1: 'left:0;top:0;bottom:0;width:5px;cursor:ew-resize', 2: 'right:0;top:0;bottom:0;width:5px;cursor:ew-resize', 3: 'left:0;right:0;top:0;height:4px;cursor:ns-resize', 6: 'left:0;right:0;bottom:0;height:5px;cursor:ns-resize', 4: 'left:0;top:0;width:10px;height:10px;cursor:nwse-resize', 5: 'right:0;top:0;width:10px;height:10px;cursor:nesw-resize', 7: 'left:0;bottom:0;width:10px;height:10px;cursor:nesw-resize', 8: 'right:0;bottom:0;width:10px;height:10px;cursor:nwse-resize' }
  for (const [side, style] of Object.entries(EDGES)) document.body.append(h('div', { class: 'edge', style, onmousedown: e => e.button === 0 && win(`size ${side}`) }))
  $('titlebar').addEventListener('mousedown', e => {
    if (e.button !== 0) return
    const button = e.target.closest('button')
    if (button) return win(button.dataset.do)
    win(e.detail === 2 ? 'max' : 'drag')
  })
  addEventListener('resize', () => requestAnimationFrame(frame))
  addEventListener('load', frame)
  // The browser can still change the window after load, so check again once it has settled.
  setTimeout(() => ((frame.size = undefined), frame()), 1000)
  frame()
}

addEventListener('keydown', e => {
  if (!modal) return
  if (e.key === 'Escape') (e.preventDefault(), modal.asking ? ask(undefined) : closeModal())
  if (e.key === 's' && (e.ctrlKey || e.metaKey) && modal.isEditing) (e.preventDefault(), save())
})
$('query').addEventListener('input', () => (($('main').scrollTop = 0), render()))
addEventListener('focus', () => call('/api/state').catch(showError))
setInterval(() => fetch('/api/ping', { headers: { 'x-token': token } }).catch(() => {}), 15000)
call('/api/state').catch(showError)
</script>
</body>
</html>
